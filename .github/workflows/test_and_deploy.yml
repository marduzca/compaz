name: Test and deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Main pushes queue so deploys never run out of order; PR runs cancel stale ones
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run only-test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run build

  visual_regression_test:
    needs: [ lint, unit_tests, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run Chromatic
        uses: chromaui/action@2b75e3340bcec86b4ae38c6a10f14831114e8137 # v18.14.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: false

  user_journey_test_local:
    needs: [ lint, unit_tests, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-cypress-binary: 'true'
      - name: create env file
        run: |
          touch .env
          echo VITE_MAPS_API_KEY=${{ secrets.DEV_MAPS_API_KEY }} >> .env
          echo VITE_FIREBASE_DEV_API_KEY=${{ secrets.DEV_FIREBASE_API_KEY }} >> .env
      - name: Run User Journey tests
        run: npm run ci:cypress-run
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: user_journey_test_local_screenshot
          path: cypress/screenshots/**

  build_and_deploy_dev:
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    needs: [ user_journey_test_local, visual_regression_test ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: create env file
        run: |
          touch .env
          echo VITE_MAPS_API_KEY=${{ secrets.DEV_MAPS_API_KEY }} >> .env
          echo VITE_FIREBASE_DEV_API_KEY=${{ secrets.DEV_FIREBASE_API_KEY }} >> .env
      - run: npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.DEV_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEV_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase
        run: npx --yes firebase-tools@15.35.0 deploy -P development

  user_journey_test_dev:
    needs: build_and_deploy_dev
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-cypress-binary: 'true'
      - name: Run User Journey tests
        run: CYPRESS_BASE_URL=https://compaz-dev.web.app npm run cypress:ci
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: user_journey_test_dev_screenshot
          path: cypress/screenshots/**

  build_and_deploy_prod:
    permissions:
      contents: read
      id-token: write
    needs: user_journey_test_dev
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: create env file
        run: |
          touch .env
          echo VITE_MAPS_API_KEY=${{ secrets.MAPS_API_KEY }} >> .env
          echo VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} >> .env
      - run: npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PROD_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase
        run: npx --yes firebase-tools@15.35.0 deploy -P default

  user_journey_test_prod:
    needs: build_and_deploy_prod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-cypress-binary: 'true'
      - name: Run User Journey tests
        run: CYPRESS_BASE_URL=https://compaz.app npm run cypress:ci
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: user_journey_test_prod_screenshot
          path: cypress/screenshots/**
