name: Test and deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Main pushes queue so deploys never run out of order; PR runs cancel stale ones
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run only-test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run build

  visual_regression_test:
    needs: [ lint, unit_tests, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run Chromatic
        uses: chromaui/action@1efa9d9b64308fe98fcf1eb4629f12639ffac902 # v18.14.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: false

  user_journey_test_local:
    needs: [ lint, unit_tests, build ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-cypress-binary: 'true'
      - name: create env file
        run: |
          touch .env
          echo VITE_MAPS_API_KEY=${{ secrets.DEV_MAPS_API_KEY }} >> .env
          echo VITE_FIREBASE_DEV_API_KEY=${{ secrets.DEV_FIREBASE_API_KEY }} >> .env
      - name: Run User Journey tests
        run: npm run ci:cypress-run
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: user_journey_test_local_screenshot
          path: cypress/screenshots/**

  build_and_deploy_dev:
    if: github.ref == 'refs/heads/main'
    needs: [ user_journey_test_local, visual_regression_test ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: create env file
        run: |
          touch .env
          echo VITE_MAPS_API_KEY=${{ secrets.DEV_MAPS_API_KEY }} >> .env
          echo VITE_FIREBASE_DEV_API_KEY=${{ secrets.DEV_FIREBASE_API_KEY }} >> .env
      - run: npm run build
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@18be666dd40e1769c63de2dac0e6053e0e8c7349 # v15.34.2
        with:
          args: deploy -P development
        env:
          FIREBASE_TOKEN: ${{ secrets.DEV_FIREBASE_TOKEN }}

  user_journey_test_dev:
    needs: build_and_deploy_dev
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-cypress-binary: 'true'
      - name: Run User Journey tests
        run: CYPRESS_BASE_URL=https://compaz-dev.web.app npm run cypress:ci
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: user_journey_test_dev_screenshot
          path: cypress/screenshots/**

  build_and_deploy_prod:
    needs: user_journey_test_dev
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: create env file
        run: |
          touch .env
          echo VITE_MAPS_API_KEY=${{ secrets.MAPS_API_KEY }} >> .env
          echo VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} >> .env
      - run: npm run build
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@18be666dd40e1769c63de2dac0e6053e0e8c7349 # v15.34.2
        with:
          args: deploy -P default
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  user_journey_test_prod:
    needs: build_and_deploy_prod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-cypress-binary: 'true'
      - name: Run User Journey tests
        run: CYPRESS_BASE_URL=https://compaz.app npm run cypress:ci
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: user_journey_test_prod_screenshot
          path: cypress/screenshots/**
