version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back until typescript-eslint supports the TS 7 API (see AGENTS.md)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Kept in line with the Node runtime in .nvmrc
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
